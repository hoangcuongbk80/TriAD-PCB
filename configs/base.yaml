model:
  model_name: openai/clip-vit-base-patch16
  embedding_dim: 512
  freeze_clip: true
  anchor_temperature: 0.07
  contrastive_temperature: 0.07
  fusion_temperature: 0.5
  anomaly_sharpness: 5.0
  residual_weight: 0.5
  margin: 0.2
  context_length: 16
  abnormal_prompts_per_anchor: 4
  top_q: 0.01
memory:
  history_capacity: 50
  sampling_ratio: 0.5
  history_top_ratio: 0.3
  normality_threshold: 0.5
  minimum_reference_patches: 32
training:
  learning_rate: 0.0001
  weight_decay: 0.0001
  epochs: 50
  warmup_epochs: 5
  batch_size: 16
  workers: 4
  beta_nce: 1.0
  gamma_abnormality: 1.0
  mu_anchor: 0.1
  patches_per_image: 128
evaluation:
  support_size: 4
  support_seeds: [1103, 2207, 3407, 4513, 5903]
  stream_seeds: [101, 211, 307, 401, 503, 601, 701, 809, 907, 1009]
  thresholds: 200
materials:
  anchors: materials/final_anchors.yaml
  prompts: materials/prompts_default.yaml

