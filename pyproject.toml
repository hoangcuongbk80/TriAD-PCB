[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triad-pcb"
version = "0.1.0"
description = "Reproducible implementation of TriAD-PCB"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "transformers>=4.45,<6",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
triad-train = "triad_pcb.train:main"
triad-evaluate = "triad_pcb.evaluate:main"
triad-select-anchors = "triad_pcb.anchor_selection:main"
triad-controlled-study = "triad_pcb.controlled_study:main"
triad-sensitivity = "triad_pcb.sensitivity:main"
triad-validate = "triad_pcb.validation:main"
triad-diagnostics = "triad_pcb.diagnostics:main"
triad-branch-study = "triad_pcb.branch_study:main"
triad-anomaly-ratio = "triad_pcb.anomaly_ratio_study:main"

[tool.setuptools.packages.find]
include = ["triad_pcb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

